# Runtime / utility versus input size, three capacity regimes, two seeds.
# Raw rows land in results/metrics/week3_scaling/n<agents>_m<resources>/<tag>/runs.csv
# Run: experiment_suite --config experiments/configs/week3_scaling.cfg
name = week3_scaling
algos = all
repeats = 3

agents = 100, 300, 1000
resources = 20, 60
density = 0.15
popularity_skew = 1.0
utility_dist = bell
utility_min = 1
utility_max = 100
capacity_mode = low, balanced, high
groups = 3
group_skew = 1.0
seed = 1, 2

save_datasets = false
