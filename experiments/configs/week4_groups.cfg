# Week 4 master matrix, extra: GROUP DISTRIBUTIONS, for the fairness analysis.
# Group-size skew and resource popularity skew decide how contested the scarce
# resources are for each group. fairness_score is NA until a metric is wired in
# (setFairnessMetric); the datasets and allocations are produced either way.
# Raw rows: results/metrics/week4_groups/n500_m25/<tag>/runs.csv
name = week4_groups
algos = all
repeats = 3

agents = 500
resources = 25
density = 0.2
popularity_skew = 0, 1.5
utility_dist = uniform
utility_min = 1
utility_max = 100
capacity_mode = low, balanced
groups = 2, 3, 5
group_skew = 0, 1, 2
seed = 1, 2, 3
